# Phase 5 demo (app/app.py). Writes nothing to results/.
checkpoint_dir: checkpoints      # E3 is offered only if its checkpoint is here
render_resolution: 128           # percept pixels per side (20 deg field)
display_px: 384                  # on-screen size of the field images
server_port: 7860

game:
  n_electrodes: 64               # small enough to play by hand: a full exhaustive pass is 512
  patient_config: configs/phase4_calibration.yaml
  patient_model: correlated      # the Phase 4 "correlated" virtual patients
  autoplay_step: 10              # queries the virtual patient answers per button press

# README GIF (scripts/make_demo_gif.py): browser screenshots of the running app, in order.
gif:
  frames_dir: results/quick/demo_frames
  output: results/phase5_demo.gif
  width: 900
  # (first frame, last frame, crop bottom in screenshot pixels (2100 x 1899), seconds per frame)
  segments:
    - [1, 8, 1830, 3.0]          # viewer: E2, E0, E1, 64 / 1024 electrodes, dead, adaptation
    - [9, 9, 1830, 3.0]          # game: the first flash
    - [10, 12, 1830, 1.5]        # three answers by clicking
    - [13, 21, 1830, 0.9]        # the virtual patient answers 10 at a time
    - [22, 22, 1830, 6.0]        # exhaustive-pass accuracy reached (101 questions)

quick:                           # headless smoke run: no browser, no network weights
  game: {n_electrodes: 16, patient_config: configs/phase4_calibration.yaml,
         patient_model: correlated, autoplay_step: 10}

# Hugging Face Space (scripts/deploy_space.py). Private until the license review is done.
space:
  repo_id: brycekage/phosphene-lab    # change if your Hugging Face username differs
  private: true
  entry: app/app.py
  title: Phosphene Lab
  summary: See what a cortical visual implant user might see, and play the patient in an active calibration game.
  staging_dir: results/quick/space    # git-ignored build of exactly what gets uploaded
  sdk_version: 6.30.0                 # matches the local gradio
  copy: [src/phosphene_lab, app/app.py, configs]
  checkpoints: [checkpoints/e3_letters.pt, checkpoints/e3_objects.pt, checkpoints/e3_obstacles.pt]
