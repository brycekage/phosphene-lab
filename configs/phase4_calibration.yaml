# Phase 4: how many queries each calibration method needs, on two kinds of patient.
seed: 0
seeds: [0, 1, 2]
patient_seed_offset: 700000
n_electrodes: 256
methods: [exhaustive, random, active]
max_queries: 2048              # one full exhaustive pass: 256 electrodes x 8 queries
checkpoint_every: 32

# "correlated": most of the deviation from the plan is array placement (shared by every
# electrode on the array) and a smooth excitability field. "independent": the Phase 1-3
# default, where every electrode deviates on its own, so sharing has little to work with.
patient_models:
  correlated:
    location_jitter_mm: 0.3
    placement_offset_mm: 1.5
    placement_rotation_deg: 5.0
    threshold_log_sd: 0.2
    threshold_field_sd: 0.35
  independent: {}

output_csv: results/phase4_calibration.csv
target_csv: results/phase4_queries_to_target.csv
output_png: results/phase4_calibration.png

quick:
  seeds: [0]
  n_electrodes: 64
  max_queries: 256
  output_csv: results/quick/phase4_calibration.csv
  target_csv: results/quick/phase4_queries_to_target.csv
  output_png: results/quick/phase4_calibration.png
