# Phase 4 (#5): does refitting the location prior to the patient's own reports help when the
# population guess is wrong? Same correlated patients as phase4_calibration.yaml, calibrated
# either with the right population prior or with the Phase 1-3 default one (no shared
# placement error). "active_fit" re-estimates the GP hyperparameters every
# fit_location_every queries, once at least 10 electrodes have pointing reports.
seed: 0
seeds: [0, 1, 2]
patient_seed_offset: 700000
n_electrodes: 256
methods: [exhaustive, active, active_fit]
max_queries: 2048
checkpoint_every: 32
fit_location_every: 50

patient_models:
  correlated_right_prior: &correlated
    location_jitter_mm: 0.3
    placement_offset_mm: 1.5
    placement_rotation_deg: 5.0
    threshold_log_sd: 0.2
    threshold_field_sd: 0.35
  correlated_wrong_prior:
    <<: *correlated
    assumed: {}                # the calibrator believes the Phase 1-3 default population

output_csv: results/phase4_fit_prior.csv
target_csv: results/phase4_fit_prior_queries_to_target.csv
output_png: results/phase4_fit_prior.png

quick:
  seeds: [0]
  n_electrodes: 64
  max_queries: 256
  output_csv: results/quick/phase4_fit_prior.csv
  target_csv: results/quick/phase4_fit_prior_queries_to_target.csv
  output_png: results/quick/phase4_fit_prior.png
