[project]
name = "phosphene-lab"
version = "0.1.0"
description = "An end-to-end sandbox for encoding and calibrating cortical visual prostheses"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bryce Kageyama" }]
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    # dynaphos imports cv2 but does not declare it.
    "opencv-python-headless>=4.9",
    "pulse2percept>=0.11",
    "dynaphos>=0.1.3",
    # Phase 2 encoders: segmentation weights (torchvision), monocular depth (transformers),
    # NYU Depth V2's MATLAB v7.3 file (h5py).
    "torchvision>=0.19",
    "transformers>=4.45",
    "h5py>=3.10",
    # Phase 3 metrics (SSIM) and Phase 4 Bayesian active calibration.
    "scikit-image>=0.24",
    "botorch>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phosphene_lab"]

# CPU-only torch keeps installs small (CUDA wheels are multiple GB).
# Colab T4 runs use Colab's preinstalled CUDA torch instead.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: excluded from the --quick CI smoke run"]
